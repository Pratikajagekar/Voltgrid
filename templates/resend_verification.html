{% extends "base.html" %}
{% block title %}Resend Verification Email — VoltGrid{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-64px)] flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md rounded-2xl border border-cyan-500/20 bg-slate-900/40 backdrop-blur-xl p-8">
    <div class="flex items-center gap-2 mb-6">
      <i class="fa-solid fa-bolt text-cyan-400 text-xl"></i>
      <span class="font-bold text-lg tracking-tight text-white">Volt<span class="text-cyan-400">Grid</span></span>
    </div>

    <h1 class="text-xl font-bold text-white mb-2"><i class="fa-solid fa-envelope-circle-check text-cyan-400 mr-2"></i>Resend Verification Email</h1>
    <p class="text-slate-400 text-sm mb-6">Enter the email you registered with and we'll send a fresh verification link.</p>

    <form method="POST" action="{{ url_for('resend_verification_page') }}" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-xs font-mono text-slate-400 mb-1.5">Email</label>
        <input type="email" name="email" required value="{{ prefill_email }}"
          class="w-full rounded-lg bg-slate-950 border border-slate-700 px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-cyan-400/50 focus:border-cyan-400"
          placeholder="jane@example.com">
      </div>
      <button type="submit"
        class="w-full py-2.5 rounded-lg bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-semibold text-sm transition shadow-glow">
        <i class="fa-solid fa-paper-plane mr-1.5"></i>Send Verification Link
      </button>
    </form>

    <p class="text-center text-xs text-slate-500 mt-6">
      <a href="{{ url_for('auth_page') }}" class="text-cyan-400 hover:underline">Back to log in</a>
    </p>
  </div>
</div>
{% endblock %}
