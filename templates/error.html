<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error {{ code }} — VoltGrid</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-200 flex items-center justify-center px-4">
  <div class="text-center max-w-md">
    <div class="text-6xl font-bold text-cyan-400 font-mono mb-4">{{ code }}</div>
    <i class="fa-solid fa-bolt-lightning text-red-400 text-3xl mb-4"></i>
    <p class="text-slate-400 mb-8">{{ message }}</p>
    <a href="/" class="inline-block px-6 py-2.5 rounded-lg bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-semibold text-sm transition">
      <i class="fa-solid fa-house mr-1.5"></i>Back to VoltGrid
    </a>
  </div>
</body>
</html>
